<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OG Farm - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="navigation.css">
</head>
<body>
    
    <header class="product-header">
    
        <!-- Top Bar -->
        <div class="top-bar">
    
            <div class="help-center">
                <i class="fa-solid fa-phone"></i>
                <span>Help Center: +234 808 414 2624</span>
            </div>
    
            <div class="top-right">
                <div class="location-select">
                    
                    <div class="country-select">
    
                        <img id="countryFlag" src="https://flagcdn.com/w40/ng.png" alt="Nigeria">
    
                        <select id="country">
    
                            <option value="ng">Nigeria</option>
                            <option value="gh">Ghana</option>
                            <option value="ke">Kenya</option>
                            <option value="za">South Africa</option>
                            <option value="eg">Egypt</option>
                            <option value="ma">Morocco</option>
                            <option value="tz">Tanzania</option>
                            <option value="ug">Uganda</option>
                            <option value="rw">Rwanda</option>
                            <option value="cm">Cameroon</option>
    
                        </select>
    
                    </div>
                  
                </div>
    
                <a href="login.html" aria-current="page">Login</a>

                <a href="register.html" class="register-link">Sign Up</a>
    
            </div>
    
        </div>
    
    
        <!-- Main Header -->
        <div class="main-header">
    
            <div class="logo">
                <a href="index.html">OG<span>Farm</span></a>
            </div>
    
    
            <div class="search-box">
    
                <input
                    type="search"
                    placeholder="Search fruits, vegetables, seeds..."
                >
    
                <button>
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
    
            </div>
    
    <div class="delivery">
    
        <i class="fa-solid fa-location-dot"></i>
    
        <div class="delivery-select">
    
            <small>Deliver to</small>
    
            <div class="location-dropdowns">
    
                <select id="stateSelect">
                    <option selected disabled>Select State</option>
                </select>
    
                <select id="lgaSelect">
                    <option selected disabled>Select LGA</option>
                </select>
    
            </div>
    
        </div>
    
    </div>
    
    
        <div class="header-icons">
    
            <a href="cart.html" class="cart-link">
    
    <i class="fa-solid fa-cart-shopping"></i>
    
    <span class="cart-count" id="cartCount">0</span>
    
</a>

            <a href="login.html" class="account active" aria-label="Log in or manage your account" aria-current="page">
                <i class="fa-solid fa-user"></i>
            </a>
    
        </div>
    
        <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
    </div>

    <nav class="navbar" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="About.html">About</a>
        <a href="product.html">Products</a>
        <a href="Reviews.html">Reviews</a>
    </nav>
    </header>


    <main class="login-page">
    
        <div class="login-container">
    
            <div class="login-card">
    
                <div class="card-header">
                    <i class="fa-solid fa-user-large"></i>
                    <h2>Welcome Back</h2>
                    <p>Sign in to your account</p>
                </div>
    
                <form id="loginForm">
    
                    <div class="form-group">
                        <label for="loginEmail">Email address</label>
                        <input type="email" id="loginEmail" name="email" placeholder="Enter your email" required>
                    </div>
    
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required>
                            <span class="toggle-password">
                                <i class="fa-solid fa-eye" id="toggleLoginEye"></i>
                            </span>
                        </div>
                    </div>
    
                    <div class="form-options">
                        <div class="checkbox-wrapper">
                            <input type="checkbox" id="rememberMe">
                            <label for="rememberMe">Remember me</label>
                        </div>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>
    
                    <button type="submit" class="btn-primary">Sign In</button>
    
                    <div class="divider">
                        <span>Or continue with</span>
                    </div>
    
                    <div class="social-buttons">
                        <a href="#" class="social-btn">
                            <i class="fa-brands fa-facebook-f"></i>
                        </a>
                        <a href="#" class="social-btn">
                            <i class="fa-brands fa-google"></i>
                        </a>
                        <a href="#" class="social-btn">
                            <i class="fa-brands fa-github"></i>
                        </a>
                    </div>
    
                </form>
    
                <div class="card-footer">
                    <p>Don't have an account? <a href="register.html" class="signup-link">Sign up</a></p>
                </div>
    
            </div>
    
        </div>
    
    </main>

    <script>
        // Toggle password visibility
        const toggleLoginEye = document.getElementById('toggleLoginEye');
        const loginPassword = document.getElementById('loginPassword');
    
        if (toggleLoginEye && loginPassword) {
            toggleLoginEye.addEventListener('click', function() {
                const type = loginPassword.getAttribute('type') === 'password' ? 'text' : 'password';
                loginPassword.setAttribute('type', type);
                
                // Toggle eye icon
                if (type === 'text') {
                    this.classList.remove('fa-eye');
                    this.classList.add('fa-eye-slash');
                } else {
                    this.classList.remove('fa-eye-slash');
                    this.classList.add('fa-eye');
                }
            });
        }
    </script>
    <script src="navigation.js"></script>
</body>
</html>
