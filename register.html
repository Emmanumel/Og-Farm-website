<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OG Farm - Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="navigation.css">
</head>
<body>
    
    <header class="product-header">
    
        <!-- Top Bar -->
        <div class="top-bar">
    
            <div class="help-center">
                <i class="fa-solid fa-phone"></i>
                <span>Help Center: +234 808 414 2624</span>
            </div>
    
            <div class="top-right">
                <div class="location-select">
                    
                    <div class="country-select">
    
                        <img id="countryFlag" src="https://flagcdn.com/w40/ng.png" alt="Nigeria">
    
                        <select id="country">
    
                            <option value="ng">Nigeria</option>
                            <option value="gh">Ghana</option>
                            <option value="ke">Kenya</option>
                            <option value="za">South Africa</option>
                            <option value="eg">Egypt</option>
                            <option value="ma">Morocco</option>
                            <option value="tz">Tanzania</option>
                            <option value="ug">Uganda</option>
                            <option value="rw">Rwanda</option>
                            <option value="cm">Cameroon</option>
    
                        </select>
    
                    </div>
                  
                </div>
    
                <a href="login.html" class="login-link">Login</a>

                <a href="register.html" aria-current="page">Sign Up</a>
    
            </div>
    
        </div>
    
    
        <!-- Main Header -->
        <div class="main-header">
    
            <div class="logo">
                <a href="index.html">OG<span>Farm</span></a>
            </div>
    
    
            <div class="search-box">
    
                <input
                    type="search"
                    placeholder="Search fruits, vegetables, seeds..."
                >
    
                <button>
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
    
            </div>
    
    <div class="delivery">
    
        <i class="fa-solid fa-location-dot"></i>
    
        <div class="delivery-select">
    
            <small>Deliver to</small>
    
            <div class="location-dropdowns">
    
                <select id="stateSelect">
                    <option selected disabled>Select State</option>
                </select>
    
                <select id="lgaSelect">
                    <option selected disabled>Select LGA</option>
                </select>
    
            </div>
    
        </div>
    
    </div>
    
    
        <div class="header-icons">
    
            <a href="cart.html" class="cart-link">
    
    <i class="fa-solid fa-cart-shopping"></i>
    
    <span class="cart-count" id="cartCount">0</span>
    
</a>

            <a href="login.html" class="account" aria-label="Log in or manage your account">
                <i class="fa-solid fa-user"></i>
            </a>
    
        </div>
    
        <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
    </div>

    <nav class="navbar" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="About.html">About</a>
        <a href="product.html">Products</a>
        <a href="Reviews.html">Reviews</a>
    </nav>
    </header>


    <main class="register-page">
    
        <div class="register-container">
    
            <div class="register-card">
    
                <div class="card-header">
                    <i class="fa-solid fa-user-plus"></i>
                    <h2>Create Account</h2>
                    <p>Join our farming community</p>
                </div>
    
                <form id="registerForm">
    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="regFirstName">First Name</label>
                            <input type="text" id="regFirstName" name="firstName" placeholder="John" required>
                        </div>
                        <div class="form-group">
                            <label for="regLastName">Last Name</label>
                            <input type="text" id="regLastName" name="lastName" placeholder="Doe" required>
                        </div>
                    </div>
    
                    <div class="form-group">
                        <label for="regEmail">Email address</label>
                        <input type="email" id="regEmail" name="email" placeholder="john@example.com" required>
                    </div>
    
                    <div class="form-group">
                        <label for="regPhone">Phone Number</label>
                        <input type="tel" id="regPhone" name="phone" placeholder="+234 808 414 2624" required>
                    </div>
    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="regPassword">Password</label>
                            <input type="password" id="regPassword" name="password" placeholder="Create a password" required>
                        </div>
                        <div class="form-group">
                            <label for="regConfirmPassword">Confirm Password</label>
                            <input type="password" id="regConfirmPassword" name="confirmPassword" placeholder "Re-enter password" required>
                        </div>
                    </div>
    
                    <div class="form-group">
                        <label for="regAddress">Delivery Address</label>
                        <textarea id="regAddress" name="address" rows="2" placeholder="Enter your delivery address" required></textarea>
                    </div>
    
                    <div class="form-options">
                        <div class="checkbox-wrapper">
                            <input type="checkbox" id="terms">
                            <label for="terms">I agree to the <a href="#" terms-terms">Terms & Conditions</a></label>
                        </div>
                    </div>
    
                    <button type="submit" class="btn-primary">Create Account</button>
    
                    <div class="divider">
                        <span>Or continue with</span>
                    </div>
    
                    <div class="social-buttons">
                        <a href="#" class="social-btn">
                            <i class="fa-brands fa-facebook-f"></i>
                        </a>
                        <a href="#" class="social-btn">
                            <i class="fa-brands fa-google"></i>
                        </a>
                        <a href="#" class="social-btn">
                            <i class="fa-brands fa-github"></i>
                        </a>
                    </div>
    
                </form>
    
                <div class="card-footer">
                    <p>Already have an account? <a href="login.html" class="login-link">Login</a></p>
                </div>
    
            </div>
    
        </div>
    
    </main>

    <script>
        // Password confirmation matching
        const regPassword = document.getElementById('regPassword');
        const regConfirmPassword = document.getElementById('regConfirmPassword');
    
        if (regPassword && regConfirmPassword) {
            regConfirmPassword.addEventListener('input', function() {
                if (regConfirmPassword.value !== regPassword.value) {
                    regConfirmPassword.setCustomValidity('Passwords do not match');
                } else {
                    regConfirmPassword.setCustomValidity('');
                }
            });
        }
    </script>
    <script src="navigation.js"></script>
</body>
</html>
